<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2f2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#grad1)" />
  
  <!-- Sandstone layers (representing cliffs) -->
  <path d="M0,600 C200,550 400,650 600,580 C800,510 900,590 1000,550 L1000,600 L0,600 Z" fill="#e6d2b5" opacity="0.8"/>
  <path d="M0,600 C150,520 300,580 500,540 C700,500 850,560 1000,520 L1000,600 L0,600 Z" fill="#d2b48c" opacity="0.4"/>
  
  <!-- Sage green layers (representing eucalyptus forest) -->
  <path d="M0,600 C100,450 300,500 500,400 C700,300 900,450 1000,350 L1000,600 L0,600 Z" fill="#a7beae" opacity="0.6"/>
  <path d="M-50,600 C150,380 400,450 650,350 C850,250 950,400 1050,300 L1050,600 L-50,600 Z" fill="#7e9085" opacity="0.3"/>
  
  <!-- Muted blue layers (representing mist/water) -->
  <path d="M0,0 C200,50 400,-20 600,60 C800,140 900,40 1000,100 L1000,0 L0,0 Z" fill="#7097a8" opacity="0.15"/>
  <path d="M0,0 C150,80 350,20 550,100 C750,180 900,100 1100,150 L1100,0 L0,0 Z" fill="#a3bad2" opacity="0.1"/>

  <!-- Subtle contour lines for detail -->
  <path d="M0,500 Q250,450 500,480 T1000,420" stroke="#7e9085" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M0,550 Q300,520 600,540 T1000,500" stroke="#d2b48c" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>
